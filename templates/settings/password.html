{% extends "base.html" %}

{% block title %}Password — Athena{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Password</h1>
        <p class="subtitle">{{ request.state.user.email }}</p>
    </div>
</div>

{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if success %}<div class="success">{{ success }}</div>{% endif %}

<div class="form-container">
    <form method="post" action="/settings/password" class="issue-form">
        {% include "partials/csrf.html" %}
        <div class="form-group">
            <label for="current-password">Current password</label>
            <input id="current-password" type="password" name="current_password" autocomplete="current-password" required>
        </div>
        <div class="form-group">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" name="new_password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="button">Update Password</button>
        </div>
    </form>
</div>
{% endblock %}
