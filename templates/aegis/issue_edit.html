{% extends "base.html" %}

{% block title %}Edit #{{ issue.id }} — {{ issue.title }} — Aegis{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="/aegis/issues/{{ issue.id }}" class="muted">← Back to issue</a>
        <h1>Edit #{{ issue.id }}</h1>
    </div>
</div>

<div class="form-container">
    <form method="post" action="/aegis/issues/{{ issue.id }}/edit" class="issue-form">
        {% include "partials/csrf.html" %}
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required value="{{ issue.title }}">
        </div>

        <div class="form-group">
            <label for="body">Description</label>
            <textarea id="body" name="body" rows="8"
                      placeholder="Details, steps to reproduce, acceptance criteria...">{{ issue.body }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="button">Save Changes</button>
            <a href="/aegis/issues/{{ issue.id }}" class="button secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
