name: Secret history

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Gitleaks (full ancestry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete candidate history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Scan candidate history without exposing matches
        run: python -I .github/scripts/check_secret_history.py
