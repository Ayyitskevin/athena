name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Create isolated test environment
        run: python -m venv .venv
      - name: Install hash-verified package installer
        run: .venv/bin/python -I -m pip install --require-hashes -r constraints/bootstrap-py312.txt
      - name: Install test extras (including MCP)
        run: .venv/bin/python -I -m pip install -c constraints/ci-py312.txt -e ".[dev,mcp]"
      - name: Verify pinned dependency set
        run: |
          .venv/bin/python -I -m pip check
          .venv/bin/python -I -m pip freeze --exclude-editable | diff -u constraints/ci-py312.txt -
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Check formatting
        run: .venv/bin/python -m ruff format --check .
      - name: Type-check every runtime module
        run: .venv/bin/python -m mypy src/athena
      - name: Check import contracts
        run: .venv/bin/python scripts/check_import_contracts.py
      - name: Check write ownership
        run: .venv/bin/python scripts/check_write_ownership.py
      - name: Check imported_at guards
        run: .venv/bin/python scripts/check_imported_at_guards.py
      - name: Run required tests with full-source branch coverage
        run: scripts/coverage.sh "$RUNNER_TEMP/athena-coverage"
      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-3.12
          path: ${{ runner.temp }}/athena-coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Build and install through the source distribution
        run: |
          set -euo pipefail
          dist_root="$(mktemp -d "$RUNNER_TEMP/athena-dist.XXXXXX")"
          .venv/bin/python -m build --sdist --outdir "$dist_root/artifacts" .
          shopt -s nullglob
          sdists=("$dist_root"/artifacts/*.tar.gz)
          if (( ${#sdists[@]} != 1 )); then
            echo "expected exactly one source distribution" >&2
            exit 1
          fi
          mkdir -p "$dist_root/source"
          .venv/bin/python -c \
            'import pathlib, sys, tarfile; tarfile.open(sys.argv[1]).extractall(pathlib.Path(sys.argv[2]), filter="data")' \
            "${sdists[0]}" "$dist_root/source"
          source_trees=("$dist_root"/source/athena-*)
          if (( ${#source_trees[@]} != 1 )); then
            echo "expected exactly one extracted source tree" >&2
            exit 1
          fi
          .venv/bin/python -m build --wheel \
            --outdir "$dist_root/artifacts" \
            "${source_trees[0]}"
          wheels=("$dist_root"/artifacts/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one wheel built from the source distribution" >&2
            exit 1
          fi
          if [[ ! -f "${source_trees[0]}/scripts/verify_wheel.py" ]] \
            || [[ ! -f "${source_trees[0]}/scripts/smoke_app.py" ]] \
            || [[ ! -f "${source_trees[0]}/scripts/check_import_contracts.py" ]]; then
            echo "source distribution is missing its verification helpers" >&2
            exit 1
          fi
          .venv/bin/python scripts/verify_wheel.py "${wheels[0]}"
          .venv/bin/python \
            "${source_trees[0]}/scripts/verify_wheel.py" \
            "${wheels[0]}"
          .venv/bin/python \
            "${source_trees[0]}/scripts/check_import_contracts.py"
          echo "ATHENA_SDIST_SOURCE=${source_trees[0]}" >> "$GITHUB_ENV"
          .venv/bin/python -I -m pip uninstall --yes athena
          .venv/bin/python -I -m pip install --no-deps "${wheels[0]}"
          .venv/bin/python -I -m pip check
      - name: Boot the sdist-derived wheel outside the checkout
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'from pathlib import Path; import athena, sys; assert Path(athena.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), athena.__file__'
          "$GITHUB_WORKSPACE/.venv/bin/python" "$ATHENA_SDIST_SOURCE/scripts/smoke_app.py"
