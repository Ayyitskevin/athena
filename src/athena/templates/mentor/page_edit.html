{% extends "base.html" %}

{% block title %}Edit {{ page.title }} — Mentor{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="/mentor/pages/{{ page.id }}" class="muted">← Back to page</a>
        <h1>Edit page</h1>
    </div>
</div>

<div class="form-container">
    <form method="post" action="/mentor/pages/{{ page.id }}/edit" class="issue-form">
        {% include "partials/csrf.html" %}
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required value="{{ page.title }}">
        </div>
        <div class="form-group">
            <label for="body">Body</label>
            <textarea id="body" name="body" rows="12" placeholder="Write the page...">{{ page.body }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="button">Save Changes</button>
            <a href="/mentor/pages/{{ page.id }}" class="button secondary">Cancel</a>
        </div>
    </form>
    <p class="note-small">Saving snapshots the current version into this page's history.</p>
</div>
{% endblock %}
