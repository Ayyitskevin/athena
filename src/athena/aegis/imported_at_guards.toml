# --- ready_queue.py ----------------------------------------------------------

[[guarded]]
module = "ready_queue.py"
function = "awaiting_answer_sql"
pattern = '(?s)rqs\.imported_at IS NULL.*rqe\.imported_at IS NULL.*rqk\.imported_at IS NULL.*rqa\.imported_at IS NULL'
why = """\
    the ready rule's settlement and its answer are both native acts: an \
    imported claim_completed must not hold work back from an account, and an \
    imported comment, review request or candidate must not hand it back"""

[[guarded]]
module = "ready_queue.py"
function = "_latest_settlements"
pattern = 's\.imported_at IS NULL'
why = """\
    the not-offered lane reads back the same native settlement the ready \
    rule chose; foreign history must not supply its reason"""

