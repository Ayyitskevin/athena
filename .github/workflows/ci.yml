name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated test environment
        run: python -m venv .venv
      - name: Install test extras (including MCP)
        run: .venv/bin/python -m pip install -c constraints/ci-py312.txt -e ".[dev,mcp]"
      - name: Verify pinned dependency set
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python -m pip freeze --exclude-editable | diff -u constraints/ci-py312.txt -
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Run tests
        run: .venv/bin/python -m pytest -q
      - name: Boot the real app
        run: .venv/bin/python scripts/smoke_app.py
