<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Athena operator loop</title>
  <desc id="desc">One operator directs agents through Aegis issues and Mentor knowledge while Athena scopes, audits, and replays every action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151d35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="64" y="78" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="36" font-weight="700">Mission control for a one-person AI fleet</text>
  <text x="64" y="114" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Direct → delegate → observe → intervene → trust</text>
  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui">
    <rect x="62" y="190" width="220" height="164" rx="20" fill="#1e293b" stroke="#475569"/>
    <circle cx="112" cy="242" r="24" fill="url(#accent)"/>
    <text x="150" y="238" fill="#f8fafc" font-size="22" font-weight="700">Operator</text>
    <text x="150" y="264" fill="#94a3b8" font-size="15">sets intent and limits</text>
    <text x="88" y="316" fill="#cbd5e1" font-size="15">approves · redirects · stops</text>

    <rect x="370" y="160" width="314" height="224" rx="24" fill="#172033" stroke="#8b5cf6" stroke-width="2"/>
    <text x="400" y="210" fill="#c4b5fd" font-size="16" font-weight="700">ATHENA</text>
    <text x="400" y="248" fill="#f8fafc" font-size="24" font-weight="700">Aegis work + Mentor context</text>
    <text x="400" y="286" fill="#94a3b8" font-size="15">one API · one SQLite truth · one audit trail</text>
    <rect x="400" y="316" width="112" height="38" rx="19" fill="#312e81"/>
    <text x="423" y="341" fill="#ddd6fe" font-size="14">scoped tokens</text>
    <rect x="524" y="316" width="128" height="38" rx="19" fill="#164e63"/>
    <text x="548" y="341" fill="#a5f3fc" font-size="14">atomic audit</text>

    <rect x="772" y="190" width="366" height="164" rx="20" fill="#1e293b" stroke="#475569"/>
    <text x="806" y="238" fill="#f8fafc" font-size="22" font-weight="700">AI fleet</text>
    <text x="806" y="269" fill="#94a3b8" font-size="15">Codex · Claude · local workers · MCP clients</text>
    <text x="806" y="316" fill="#cbd5e1" font-size="15">claims work · writes docs · reports runs</text>
  </g>
  <path d="M282 272H355" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M684 272H757" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M940 370C890 452 360 452 244 370" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/>
  <text x="492" y="454" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="600">attribution · replay · exception-focused control</text>
</svg>
