# The size of Athena's surface (B6b): routes, MCP tools and tables.
#
# docs/PRUNE_LEDGER.md asks each subsystem to justify its keep. Nothing made an
# addition say what it earns, and the ledger's own counts went stale (August:
# 362 routes, 124 tools, 65 tables). scripts/check_surface_counts.py measures the
# three and fails unless the baseline plus every [[change]] below equals what it
# measures. A change that adds to a count records it here with what the addition
# earns; a change that removes records that too. Counting:
#
#   routes  every route the app registers, flattened through included routers
#           (browser pages, form posts, the API, the documents): what
#           check_template_routes.py reads
#   tools   every MCP tool declared (mcp/server.py's declared(), the full profile)
#   tables  every table and virtual table of a migrated database, without
#           SQLite's own (sqlite_*) and a virtual table's shadow tables
#
# A [[change]] carries `change` (the requirement or PR), the deltas it made
# (`routes`, `tools`, `tables`, each optional, signed), and `earns`: required
# when any delta is positive, one sentence on what the addition is for. Setting a
# prune verdict is the owner's act and is not recorded here.

[baseline]
date = "2026-11-25"
routes = 417
tools = 146
tables = 73

[[change]]
change = "Wave 10, decision 6: DELETE /issues/{id}/prior-texts/{event_id}"
routes = 1
earns = "An administrator can remove a secret that an issue edit's kept prior text still held, with an audit event; before it, no edit could take text back."

[[change]]
change = "Wave 10, decision 8 (T1): POST /issues/{id}/assign-seat and the conductor's assign_issue_to_seat tool"
routes = 1
tools = 1
earns = "A conductor agent can hand a slice to a declared fleet seat by its slug and wake it over Buzz, as the operator does from the floor, without first knowing the seat's account id."

[[change]]
change = "Wave 10, decision 8 (T2): POST /aegis/palette/issues/{id}/resume"
routes = 1
earns = "An operator who takes over an issue a seat handed off can acknowledge the handoff from the palette, and then hand it off in turn, without leaving the browser."

[[change]]
change = "Wave 10, decision 8 (T3): POST /aegis/sprints/{id}/edit"
routes = 1
earns = "The project creator can correct a sprint's name, goal or dates on the sprint list instead of leaving the browser for the API."
