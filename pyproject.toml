[project]
name = "athena"
version = "0.0.1"
description = "Self-hosted operator workspace: docs, tasks, and cross-links — built for solo operators and AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "markdown-it-py",
    "nh3",
    # OIDC single sign-on: PyJWT validates the ID token's signature against the
    # provider's JWKS (the [crypto] extra pulls in `cryptography` for RS256/ES256).
    # The HTTP calls (discovery, token exchange) use stdlib urllib, like webhooks.
    "pyjwt[crypto]",
    "python-multipart",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# Starlette's TestClient prefers httpx2. Keep httpx too: Athena's MCP client
# imports it directly and the MCP SDK requires it.
dev = ["pytest", "httpx", "httpx2>=2,<3", "ruff>=0.8,<1"]
# The MCP server is optional — it lets an AI agent drive Athena over MCP. Install
# with `pip install athena[mcp]`. Kept out of the base install so the core app
# stays lean; CI opts in explicitly so the MCP wiring test cannot silently skip.
mcp = ["mcp>=1.2", "httpx"]

[project.scripts]
athena-backup = "athena.ops:backup_main"
athena-doctor = "athena.ops:doctor_main"
athena-export = "athena.ops:export_main"
athena-export-run = "athena.ops:export_run_main"
athena-import = "athena.ops:import_main"
athena-import-dry-run = "athena.ops:import_dry_run_main"
athena-import-manifest = "athena.ops:import_manifest_main"
athena-map-source = "athena.ops:map_source_main"
athena-restore = "athena.ops:restore_main"
athena-mcp = "athena.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
