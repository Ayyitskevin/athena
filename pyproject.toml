[project]
name = "athena"
version = "0.0.1"
description = "Self-hosted project management (Aegis) + knowledge base (Mentor)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "markdown-it-py",
    "nh3",
    "python-multipart",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff>=0.8,<1"]
# The MCP server is optional — it lets an AI agent drive Athena over MCP. Install
# with `pip install athena[mcp]`. Kept out of the base install so the core app
# (and its CI) stay lean; nothing in the core imports these.
mcp = ["mcp>=1.2", "httpx"]

[project.scripts]
athena-backup = "athena.ops:backup_main"
athena-restore = "athena.ops:restore_main"
athena-mcp = "athena.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
