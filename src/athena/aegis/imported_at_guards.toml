# --- leases.py ---------------------------------------------------------------

[[guarded]]
module = "leases.py"
function = "unrecorded_lapses"
pattern = 'AND a\.imported_at IS NULL'
why = """\
    whether this instance already recorded a lease generation's lapse (C4): \
    an imported row carrying the verb is foreign history, not this \
    instance's record, and must not suppress the native event or its \
    notifications"""

# --- approval_rows.py --------------------------------------------------------

[[guarded]]
module = "approval_rows.py"
function = "_ask_event_id"
pattern = 'AND imported_at IS NULL'
why = """\
    the approval queue ties a pending ask to the native approval_requested \
    event Athena recorded for it; an imported row with the same words is \
    foreign history and must not move the instant the ask was made (U9)"""

