[project]
name = "athena"
version = "0.1.0a1"
description = "Self-hosted operator workspace: docs, tasks, and cross-links — built for solo operators and AI agents"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Groupware",
]
# Upper bounds are load-bearing, for exactly the reason recorded under [mcp] below:
# a major that drops an API we import produces an `athena` that crashes on use, and
# CI never sees it because CI always installs under `-c constraints/ci-py312.txt`.
# Project metadata is the only thing protecting an install that skips the
# constraints file, so every runtime dependency carries a next-major ceiling.
#
# Lower bounds are the oldest line Athena has actually shipped against — the
# versions in constraints/ci-py312.txt. They are deliberately not wider: CI
# verifies one exact set, so a wider floor would be a support claim with no
# evidence behind it. Widen a floor only alongside a run that proves it.
dependencies = [
    "fastapi>=0.141,<1",
    "jinja2>=3.1,<4",
    "markdown-it-py>=4.2,<5",
    # nh3 is the HTML sanitizer standing between author markdown and the browser.
    # Its ceiling is a security boundary, not just a compatibility one.
    "nh3>=0.3,<1",
    # OIDC single sign-on: PyJWT validates the ID token's signature against the
    # provider's JWKS (the [crypto] extra pulls in `cryptography` for RS256/ES256).
    # The HTTP calls (discovery, token exchange) use stdlib urllib, like webhooks.
    "pyjwt[crypto]>=2.13,<3",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
# Starlette's TestClient prefers httpx2. Keep httpx too: Athena's MCP client
# imports it directly and the MCP SDK requires it.
# `mcp` is included here (not just in the standalone extra below) on purpose: the
# suite has tests that exercise the real MCP server wiring. Those tests import the
# SDK directly, so an incomplete `[dev]` environment fails instead of reporting a
# green run with the product differentiator skipped. Installing `[dev]` therefore
# exercises server.py the same way CI does.
# pytest-xdist: the suite is deterministic (no time.sleep, Barrier-coordinated
# races, per-test tmp_path databases), so it parallelizes cleanly — `pytest -n 4`
# cuts the gate from ~16 min to ~3 min. Plain `pytest -q` remains valid.
dev = [
    "build>=1.5,<1.5.1",
    "coverage>=7.15,<8",
    "mypy>=2.3,<3",
    "pytest-cov>=7.1,<8",
    "pytest",
    # Generative tests over the hand-rolled parsers (link grammar, work-query
    # grammar, import readers). Curated cases prove the shapes we thought of;
    # these probe the ones we did not. Deterministic in CI — see tests/conftest.py.
    "hypothesis>=6.140,<7",
    "pytest-xdist>=3.5,<4",
    # Workflow-policy tests parse YAML structurally so valid alternate syntax
    # cannot bypass immutable-action checks.
    "pyyaml>=6,<7",
    "httpx",
    "httpx2>=2,<3",
    "ruff>=0.8,<1",
    "mcp>=1.2,<2",
]
# The MCP server is optional AT RUNTIME — it lets an AI agent drive Athena over MCP.
# Install with `pip install athena[mcp]`. Kept out of the base runtime install so the
# core app stays lean; the dev/test group above always pulls it so the wiring is tested.
# The `<2` bound is load-bearing, not caution: MCP SDK 2.0 removed
# `mcp.server.fastmcp`, which server.py imports, so an unconstrained install (any
# install that skips `-c constraints/ci-py312.txt`) produced an athena-mcp that
# crashed on import. CI never saw it because CI always installs under the
# constraints file; project metadata has to protect everyone else.
mcp = ["mcp>=1.2,<2", "httpx"]

[project.scripts]
athena-backup = "athena.ops:backup_main"
athena-doctor = "athena.ops:doctor_main"
athena-seat-doctor = "athena.ops:seat_doctor_main"
athena-export = "athena.ops:export_main"
athena-export-run = "athena.ops:export_run_main"
athena-field-guide = "athena.ops:field_guide_main"
athena-import = "athena.ops:import_main"
athena-import-dry-run = "athena.ops:import_dry_run_main"
athena-import-manifest = "athena.ops:import_manifest_main"
athena-map-source = "athena.ops:map_source_main"
athena-restore = "athena.ops:restore_main"
athena-serve = "athena.ops:serve_main"
athena-mcp = "athena.mcp.server:main"
athena-demo = "athena.demo:main"

[project.urls]
Homepage = "https://github.com/Ayyitskevin/athena"
Repository = "https://github.com/Ayyitskevin/athena"
Issues = "https://github.com/Ayyitskevin/athena/issues"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Runtime-owned files must travel with both wheels and source distributions.
athena = [
    "core/migrations/*.sql",
    "field_guide/*.md",
    "static/*",
    "static/**/*",
    "templates/*.html",
    "templates/**/*.html",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# BLE (flake8-blind-except) is enabled deliberately. Every broad catch in the
# tree today is correct — a two-phase blob rollback, recovery-bundle failures
# translated into domain errors, post-commit cleanup collected into an
# ExceptionGroup, a thread target captured for the main thread — and each now
# carries a `# noqa: BLE001` stating why. The rule is not here to fix existing
# code; it is here so the NEXT accidental `except Exception:` fails the gate
# instead of being reviewed by hope. It also makes the `# noqa: BLE001` comments
# that were already in the tree load-bearing rather than decorative.
select = ["E4", "E7", "E9", "F", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/athena"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/athena"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = false

# Floors ratchet upward as real coverage rises (last: 92.84/82.73/90.56 at
# Stage I) — set a shade below the current measurement so gains are locked in
# without making the very next well-tested module a gate failure.
[tool.athena.coverage]
line_floor = 92.60
branch_floor = 82.30
combined_floor = 90.30
excluded_line_count = 2
