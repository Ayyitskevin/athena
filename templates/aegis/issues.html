{% extends "base.html" %}

{% block title %}Issues — Aegis{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Issues</h1>
        <p class="subtitle">Aegis work items</p>
    </div>
    <div class="header-actions">
        <a href="/aegis/issues/new" class="button">+ New Issue</a>
        <input 
            type="text" 
            name="search" 
            placeholder="Search issues..." 
            value="{{ search }}"
            class="search-input"
            hx-get="/aegis/issues?page=1&per_page=20"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#issues-table"
            hx-swap="outerHTML"
            hx-include="[name='status'],[name='search'],[name='sort'],[name='order']">
        <select 
            class="filter-select"
            name="status"
            hx-get="/aegis/issues?page=1&per_page=20"
            hx-target="#issues-table"
            hx-swap="outerHTML"
            hx-include="[name='status'],[name='search'],[name='sort'],[name='order']">
            <option value="">All statuses</option>
            <option value="open" {% if status_filter == 'open' %}selected{% endif %}>Open</option>
            <option value="in_progress" {% if status_filter == 'in_progress' %}selected{% endif %}>In Progress</option>
            <option value="done" {% if status_filter == 'done' %}selected{% endif %}>Done</option>
        </select>
        <select 
            class="filter-select"
            name="sort"
            hx-get="/aegis/issues?page=1&per_page=20"
            hx-target="#issues-table"
            hx-swap="outerHTML"
            hx-include="[name='status'],[name='search'],[name='sort'],[name='order']">
            <option value="created_at" {% if sort == 'created_at' or not sort %}selected{% endif %}>Sort: Created</option>
            <option value="title" {% if sort == 'title' %}selected{% endif %}>Sort: Title</option>
            <option value="status" {% if sort == 'status' %}selected{% endif %}>Sort: Status</option>
        </select>
        <select 
            class="filter-select"
            name="order"
            hx-get="/aegis/issues?page=1&per_page=20"
            hx-target="#issues-table"
            hx-swap="outerHTML"
            hx-include="[name='status'],[name='search'],[name='sort'],[name='order']">
            <option value="desc" {% if order == 'desc' or not order %}selected{% endif %}>Desc</option>
            <option value="asc" {% if order == 'asc' %}selected{% endif %}>Asc</option>
        </select>
        <button 
            class="button secondary"
            hx-get="/aegis/issues?page=1&per_page=20"
            hx-target="#issues-table"
            hx-swap="outerHTML"
            hx-include="[name='status'],[name='search'],[name='sort'],[name='order']">
            Refresh
        </button>
    </div>
</div>

{% include "aegis/partials/issues_table.html" %}

<p class="note">Data from the Aegis issues API.</p>
{% endblock %}
