{% extends "base.html" %}

{% block title %}Boards — Aegis{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="/aegis" class="muted">← Back to Aegis</a>
        <h1>Boards</h1>
        <p class="subtitle">Kanban workflow</p>
    </div>
    <div class="header-actions">
        <input 
            type="text" 
            name="search" 
            placeholder="Search boards..." 
            value="{{ search }}"
            class="search-input"
            hx-get="/aegis/boards"
            hx-trigger="keyup changed delay:300ms"
            hx-target=".board"
            hx-swap="outerHTML"
            hx-include="[name='status'],[name='search']">
        <select 
            class="filter-select"
            name="status"
            hx-get="/aegis/boards"
            hx-target=".board"
            hx-swap="outerHTML"
            hx-include="[name='status'],[name='search']">
            <option value="">All statuses</option>
            <option value="open" {% if status_filter == 'open' %}selected{% endif %}>Open</option>
            <option value="in_progress" {% if status_filter == 'in_progress' %}selected{% endif %}>In Progress</option>
            <option value="done" {% if status_filter == 'done' %}selected{% endif %}>Done</option>
        </select>
        <button 
            class="button secondary"
            hx-get="/aegis/boards"
            hx-target=".board"
            hx-swap="outerHTML"
            hx-include="[name='status'],[name='search']">
            Refresh
        </button>
    </div>
</div>

{% include "aegis/partials/boards_content.html" %}

<p class="note">Kanban view over real issues data from the API.</p>
{% endblock %}
