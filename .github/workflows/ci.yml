name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create isolated test environment
        run: python -m venv .venv
      - name: Install test extras (including MCP)
        run: .venv/bin/python -m pip install -c constraints/ci-py312.txt -e ".[dev,mcp]"
      - name: Verify pinned dependency set
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python -m pip freeze --exclude-editable | diff -u constraints/ci-py312.txt -
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Check import contracts
        run: .venv/bin/python scripts/check_import_contracts.py
      - name: Run tests
        # -n 4: the suite is deterministic (no sleeps, per-test tmp databases) and
        # parallelizes cleanly — this cuts the gate from ~16 min to ~3-4 min.
        run: .venv/bin/python -m pytest -q -n 4
      - name: Build and install through the source distribution
        run: |
          set -euo pipefail
          dist_root="$(mktemp -d "$RUNNER_TEMP/athena-dist.XXXXXX")"
          .venv/bin/python -m build \
            --outdir "$dist_root/artifacts" \
            --sdist-extract-dir "$dist_root/source" \
            .
          shopt -s nullglob
          sdists=("$dist_root"/artifacts/*.tar.gz)
          wheels=("$dist_root"/artifacts/*.whl)
          source_trees=("$dist_root"/source/athena-*)
          if (( ${#sdists[@]} != 1 || ${#wheels[@]} != 1 || ${#source_trees[@]} != 1 )); then
            echo "expected exactly one sdist, wheel, and extracted source tree" >&2
            exit 1
          fi
          if [[ ! -f "${source_trees[0]}/scripts/verify_wheel.py" ]] \
            || [[ ! -f "${source_trees[0]}/scripts/smoke_app.py" ]] \
            || [[ ! -f "${source_trees[0]}/scripts/check_import_contracts.py" ]]; then
            echo "source distribution is missing its verification helpers" >&2
            exit 1
          fi
          .venv/bin/python scripts/verify_wheel.py "${wheels[0]}"
          .venv/bin/python \
            "${source_trees[0]}/scripts/verify_wheel.py" \
            "${wheels[0]}"
          .venv/bin/python \
            "${source_trees[0]}/scripts/check_import_contracts.py"
          echo "ATHENA_SDIST_SOURCE=${source_trees[0]}" >> "$GITHUB_ENV"
          .venv/bin/python -m pip uninstall --yes athena
          .venv/bin/python -m pip install --no-deps "${wheels[0]}"
          .venv/bin/python -m pip check
      - name: Boot the sdist-derived wheel outside the checkout
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'from pathlib import Path; import athena, sys; assert Path(athena.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), athena.__file__'
          "$GITHUB_WORKSPACE/.venv/bin/python" "$ATHENA_SDIST_SOURCE/scripts/smoke_app.py"
