{% extends "base.html" %}

{% block title %}{{ error_title }} — Athena Rooms{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>{{ error_title }}</h1>
        <p class="subtitle">{{ error_detail }}</p>
    </div>
</div>

<div class="room-state room-state-{{ error_tone or 'error' }}" role="alert">
    {{ error_detail }}
</div>

<p><a href="{{ back_url or '/aegis/projects' }}">← Back</a></p>
{% endblock %}
