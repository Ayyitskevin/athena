name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create isolated test environment
        run: python -m venv .venv
      - name: Install test extras (including MCP)
        run: .venv/bin/python -m pip install -c constraints/ci-py312.txt -e ".[dev,mcp]"
      - name: Verify pinned dependency set
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python -m pip freeze --exclude-editable | diff -u constraints/ci-py312.txt -
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Run tests
        run: .venv/bin/python -m pytest -q
      - name: Build and install the wheel
        run: |
          .venv/bin/python -m pip wheel --no-deps --wheel-dir wheelhouse .
          .venv/bin/python scripts/verify_wheel.py wheelhouse/athena-*.whl
          .venv/bin/python -m pip uninstall --yes athena
          .venv/bin/python -m pip install --no-deps wheelhouse/athena-*.whl
          .venv/bin/python -m pip check
      - name: Boot the installed wheel outside the checkout
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'from pathlib import Path; import athena, sys; assert Path(athena.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), athena.__file__'
          "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_app.py"
