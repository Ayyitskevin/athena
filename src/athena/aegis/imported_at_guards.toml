# Every read of the activity table in athena.aegis, and how it treats
# imported rows. scripts/check_imported_at_guards.py reads this file and every
# other imported_at_guards.toml under src/athena, and fails the build on an
# activity reader that no file declares. A module's entries live in the nearest
# imported_at_guards.toml at or above its directory (this one, for the modules
# beside it); `module` is relative to this file.
#
# [[mechanism]]  a native-only mechanism listed in docs/FORGE.md's guard table:
#                `label` names its row (MECHANISM_ROWS in the checker) and
#                `pattern` must appear in `function` (in the whole file, for a
#                migration).
# [[guarded]]    another native-only reader: `pattern` must appear in
#                `function`; `why` says why foreign history must not reach it.
# [[exempt]]     a general reader allowed to see imported rows; `why` says why
#                that is safe. Function "<module>" is a module-level SQL
#                constant. An exempt reader that stops reading the trail fails
#                as stale.

# --- automation.py -----------------------------------------------------------

# The scan opts into native-only at the call site (H-0.3); the
# guard itself lives in list_events' native_only branch.
[[mechanism]]
label = "Automation scan"
module = "automation.py"
function = "process_pending"
pattern = 'native_only=True'

[[guarded]]
module = "automation.py"
function = "_schedule_target_query"
pattern = 'AND a\.imported_at IS NULL'
why = """\
    the inactive_for schedule condition measures NATIVE inactivity: a forge \
    delivery or import bundle is foreign history and must not reset the \
    clock on work it never touched (the schedule twin of the event scan's \
    native_only guard)"""

[[exempt]]
module = "automation.py"
function = "_already_fired"
why = """\
    run-scoped existence check; imported rows carry NULL run coordinates \
    (activity.record enforces), so foreign history can never satisfy run_id \
    = ?"""

# --- claim_handoffs.py -------------------------------------------------------

[[exempt]]
module = "claim_handoffs.py"
function = "<module>"
why = """\
    the projection joins activity by the handoff row's own yield/resume \
    event ids; handoff rows are written only by the 0058 trigger, which \
    already excludes imported events"""

# --- desk.py -----------------------------------------------------------------

[[exempt]]
module = "desk.py"
function = "_events_since"
why = """\
    the desk's 'what changed since you looked' count must equal what GET \
    /events would hand the same reader, and that feed serves the trail as-is \
    (imported rows included, labeled); excluding foreign history here would \
    make the count disagree with the drain it exists to size"""

[[exempt]]
module = "desk.py"
function = "latest_visible_event_id"
why = """\
    the value a fully-drained reader would acknowledge, so it must span \
    exactly the rows that reader can drain — the same general-feed \
    population as _events_since above"""

# --- desk_commands.py --------------------------------------------------------

[[exempt]]
module = "desk_commands.py"
function = "advance_cursor"
why = """\
    the cursor's upper bound is the trail's newest row as stored, so a \
    reader may acknowledge any event the general feed handed it — imported \
    rows included, as GET /events and _events_since serve them; bounding by \
    native rows only would refuse an honest acknowledgement of a foreign \
    event"""

# --- fleet_attention.py ------------------------------------------------------

[[mechanism]]
label = "Attention rollup, security refusal counters"
module = "fleet_attention.py"
function = "build_attention"
pattern = 'imported_at IS NULL'

[[guarded]]
module = "fleet_attention.py"
function = "_collect_budget_exhaustions"
pattern = 'imported_at IS NULL'
why = """\
    the ranked attention queue's budget-exhaustion signal is a native-only \
    read; foreign history must not look like a live ceiling hit"""

# --- fleet_metrics.py --------------------------------------------------------

[[mechanism]]
label = "Fleet metrics"
module = "fleet_metrics.py"
function = "_load_visible_lifecycle"
pattern = 'imported_at IS NULL'

# The evidence query deliberately SELECTs imported rows so coverage
# can count them as excluded; the drop happens row-by-row here.
[[mechanism]]
label = "Fleet metrics"
module = "fleet_metrics.py"
function = "build_fleet_metrics"
pattern = 'row\["imported_at"\] is not None'

[[exempt]]
module = "fleet_metrics.py"
function = "_evidence_statement"
why = """\
    the evidence query deliberately SELECTs imported rows so coverage can \
    report them as excluded_imported_events; build_fleet_metrics drops them \
    row-by-row, asserted in MECHANISMS"""

# --- fleet_work.py -----------------------------------------------------------

[[guarded]]
module = "fleet_work.py"
function = "build_active_work"
pattern = 'imported_at IS NULL'
why = """\
    the live-issue claim join is a native-only projection of who holds the \
