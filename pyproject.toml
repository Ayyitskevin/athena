[project]
name = "athena"
version = "0.0.1"
description = "Self-hosted project management (Aegis) + knowledge base (Mentor)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "python-multipart",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff>=0.8,<1"]

[project.scripts]
athena-backup = "athena.ops:backup_main"
athena-restore = "athena.ops:restore_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
